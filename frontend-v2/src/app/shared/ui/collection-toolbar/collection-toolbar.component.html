<form class="collection-toolbar" (submit)="onSubmit($event)">
  <div class="collection-toolbar__control">
    <input
      type="search"
      class="collection-toolbar__input"
      [placeholder]="searchPlaceholder()"
      [value]="searchDraft()"
      (input)="searchDraft.set($any($event.target).value)"
      [attr.aria-label]="searchPlaceholder()"
    />
    <button type="submit" class="collection-toolbar__submit" aria-label="Search">
      <mat-icon>search</mat-icon>
    </button>
  </div>
</form>
