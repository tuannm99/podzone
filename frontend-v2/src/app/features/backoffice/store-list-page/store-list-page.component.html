<app-card class="store-list-page__card">
  <div class="store-list-page__header">
    <h1 class="store-list-page__title">Stores</h1>
  </div>

  <div class="store-list-page__controls">
    <app-collection-toolbar
      [search]="stores.query().search || ''"
      searchPlaceholder="Search store name, description, or status"
      (searchChange)="onSearch($event)"
    />

    <app-collection-filters
      [fields]="fieldSpec"
      [filters]="stores.query().filters || []"
      (filtersChange)="onFiltersChange($event)"
    />

    <app-column-picker
      class="store-list-page__column-picker"
      [columns]="columns()"
      [hidden]="hiddenColumns()"
      (toggle)="onToggleColumn($event)"
    />
  </div>

  <ng-template #statusCell let-row>
    <app-badge [tone]="row.isActive ? 'success' : 'neutral'">{{ row.status }}</app-badge>
  </ng-template>

  <app-data-table
    [columns]="columns()"
    [rows]="stores.page.value()?.items ?? []"
    [loading]="stores.page.isLoading()"
    [error]="stores.page.error()?.message ?? ''"
    emptyTitle="No stores"
    emptyCopy="No stores match the current search and filters."
    [totalCount]="stores.page.value()?.pageInfo?.total ?? 0"
    [pageSize]="stores.query().pageSize"
    [pageIndex]="stores.query().page - 1"
    [sortActive]="stores.query().sortBy || 'createdAt'"
    [sortDirection]="sortDirection()"
    [hiddenColumns]="hiddenColumns()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  />
</app-card>
